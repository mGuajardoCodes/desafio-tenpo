spring.application.name=desafiotenpo
server.port=8081

# Redis Cache
spring.cache.type=redis
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.time=30

management.endpoints.web.exposure.include=health

spring.main.allow-bean-definition-overriding=true
logging.level.org.springframework.cache=DEBUG
logging.level.org.springframework.data.redis=DEBUG

# R2DBC connection settings
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres
spring.r2dbc.database=mydb
spring.r2dbc.port=5432
spring.r2dbc.host=localhost

# Rate limiter config
# Max requests per minute
rate-limiter.limit=3
rate-limiter.window=1m

# Webclient config
webclient.retries=3
webclient.timeout=1000

spring.data.redis.repositories.enabled=true



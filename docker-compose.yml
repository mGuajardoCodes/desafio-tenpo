version: '3.9'


networks:
  app-network:
    driver: bridge

services:
  app:
    build:
      context: .
      dockerfile: DockerFile
    image: desafiotenpo-app:1.0.0-SNAPSHOT
    container_name: desafiotenpo-app
    ports:
      - "8081:8081"
    environment:
      - SPRING_R2DBC_USERNAME=postgres
      - SPRING_R2DBC_PASSWORD=postgres
      - SPRING_R2DBC_DATABASE=mydb
      - SPRING_R2DBC_PORT=5432
      - SPRING_R2DBC_HOST=db
      - RATE_LIMITER_LIMIT=3
      - RATE_LIMITER_WINDOW=1m
      - WEBCLIENT_RETRIES=3
      - WEBCLIENT_TIMEOUT=1000
      - SPRING_APPLICATION_NAME=desafiotenpo
      - SERVER_PORT=8081
      - SPRING_CACHE_TYPE=redis
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_TIME=30
      - SPRING_REDIS_PASSWORD=
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CACHE=DEBUG
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATA_REDIS=DEBUG
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--bind", "0.0.0.0" ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network
    volumes:
      - redis-data:/data

  db:
    image: postgres:17-alpine
    container_name: db
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  redis-data:
  db-data:
